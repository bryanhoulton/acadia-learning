openapi: 3.0.3
info:
  title: Entity API
  version: 1.0.0
paths:
  /api/entities/annotations/:
    get:
      operationId: entities_annotations_list
      description: |-
        ViewSet for creating and managing session annotations.
        Requires admin authentication.
      tags:
      - entities
      security:
      - AccountAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Annotation'
          description: ''
    post:
      operationId: entities_annotations_create
      description: |-
        ViewSet for creating and managing session annotations.
        Requires admin authentication.
      tags:
      - entities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnotationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AnnotationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AnnotationRequest'
        required: true
      security:
      - AccountAuthentication: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Annotation'
          description: ''
  /api/entities/annotations/{id}/:
    get:
      operationId: entities_annotations_retrieve
      description: |-
        ViewSet for creating and managing session annotations.
        Requires admin authentication.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Annotation.
        required: true
      tags:
      - entities
      security:
      - AccountAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Annotation'
          description: ''
    put:
      operationId: entities_annotations_update
      description: |-
        ViewSet for creating and managing session annotations.
        Requires admin authentication.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Annotation.
        required: true
      tags:
      - entities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnotationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AnnotationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AnnotationRequest'
        required: true
      security:
      - AccountAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Annotation'
          description: ''
    patch:
      operationId: entities_annotations_partial_update
      description: |-
        ViewSet for creating and managing session annotations.
        Requires admin authentication.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Annotation.
        required: true
      tags:
      - entities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAnnotationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAnnotationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAnnotationRequest'
      security:
      - AccountAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Annotation'
          description: ''
    delete:
      operationId: entities_annotations_destroy
      description: |-
        ViewSet for creating and managing session annotations.
        Requires admin authentication.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Annotation.
        required: true
      tags:
      - entities
      security:
      - AccountAuthentication: []
      responses:
        '204':
          description: No response body
