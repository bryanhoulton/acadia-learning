components:
  schemas:
    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/UserProfile'
          readOnly: true
        account_status:
          type: string
          readOnly: true
        stripe_subscription_status:
          type: string
          nullable: true
          readOnly: true
        referral_count:
          type: integer
          readOnly: true
        referral_link:
          type: string
          readOnly: true
        has_texted_tutor:
          type: boolean
          readOnly: true
        account_phone:
          type: string
          maxLength: 255
        zip_code:
          type: string
          nullable: true
          maxLength: 255
        timezone:
          type: string
          nullable: true
          maxLength: 255
        is_active:
          type: boolean
        is_admin:
          type: boolean
        is_locked:
          type: boolean
          description: If True, account cannot start new classroom sessions unless
            paid
        is_human_controlled:
          type: boolean
          description: If True, entity won't wake autonomously - human operates via
            control panel
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        tutor_name:
          type: string
          maxLength: 255
        attribution:
          type: string
          nullable: true
          description: Attribution
          maxLength: 255
        signup_metadata:
          nullable: true
          description: Metadata captured at signup (UTM params, referrer, etc.)
        stripe_customer_id:
          type: string
          nullable: true
          description: Stripe customer ID for this account.
          maxLength: 255
        revenuecat_app_user_id:
          type: string
          nullable: true
          description: RevenueCat app user ID (usually account UUID)
          maxLength: 255
        revenuecat_subscription_status:
          nullable: true
          description: |-
            Current RevenueCat subscription status

            * `active` - Active
            * `expired` - Expired
            * `in_trial` - In Trial
            * `cancelled` - Cancelled
            * `paused` - Paused
          oneOf:
          - $ref: '#/components/schemas/RevenuecatSubscriptionStatusEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        revenuecat_product_id:
          type: string
          nullable: true
          description: RevenueCat product identifier (e.g., 'monthly', 'yearly')
          maxLength: 255
        revenuecat_entitlement:
          type: string
          nullable: true
          description: RevenueCat entitlement ID (e.g., 'Acadia Learning Pro')
          maxLength: 255
        subscription_expires_at:
          type: string
          format: date-time
          nullable: true
          description: When the current subscription period expires
        registration_source:
          allOf:
          - $ref: '#/components/schemas/RegistrationPlatformEnum'
          description: |-
            Platform where the account was registered (web or mobile)

            * `web` - Web
            * `mobile` - Mobile
        playgrounds_enabled:
          type: boolean
          description: If True, all playgrounds are enabled. If False, only the canvas
            playground is available.
        speed_lab_enabled:
          type: boolean
          description: If True, the Speed Lab playground is enabled for this account.
        alt_tutor:
          type: boolean
          description: If True, use the alt-tutor prompt stack for live classroom
            sessions.
        user:
          type: integer
        referred_by:
          type: string
          format: uuid
          nullable: true
          description: Account that referred this user
      required:
      - account_phone
      - account_status
      - created_at
      - has_texted_tutor
      - id
      - profiles
      - referral_count
      - referral_link
      - stripe_subscription_status
      - updated_at
      - user
