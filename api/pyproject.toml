[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2.1",
    "djangorestframework>=3.16.0",
    "djangorestframework-simplejwt>=5.4.0",
    "psycopg2-binary>=2.9.10",
    "python-dotenv>=1.1.0",
    "twilio>=9.6.1",
    "requests>=2.31.0",
    "gunicorn>=23.0.0",
    "whitenoise>=6.9.0",
    "livekit>=1.0.7",
    "livekit-api>=1.0.2",
    "django-cors-headers>=4.7.0",
    "openai>=2.8.0",
    "anthropic>=0.40.0",
    "pytz>=2024.1",
    "faker>=37.3.0",
    "exa-py>=1.13.1",
    "drf-spectacular>=0.28.0",
    "celery>=5.5.2",
    "redis>=6.1.0",
    "phonenumbers>=9.0.5",
    "posthog>=3.5.0",
    "stripe>=12.2.0",
    "agentmail>=0.1.5",
    "selenium>=4.33.0",
    "webdriver-manager>=4.0.2",
    "pre-commit>=4.2.0",
    "ruff>=0.1.0",
    "pgvector>=0.4.1",
    "ipython>=9.4.0",
    "google-genai>=1.23.0",
    "google-cloud>=0.34.0",
    "google-cloud-run>=0.10.18",
    "boto3>=1.39.1",
    "django-stubs-ext>=5.2.1",
    "djangorestframework-stubs>=3.16.1",
    "django-stubs>=5.2.1",
    "mypy>=1.17.0",
    "celery-types>=0.23.0",
    "django-types>=0.22.0",
    "types-pytz>=2025.2.0.20250516",
    "google-auth-oauthlib>=1.2.2",
    "google-auth-httplib2>=0.2.0",
    "resend>=2.11.0",
    "django-filter>=25.1",
    "tiktoken>=0.11.0",
    "flower>=2.0.1",
    "slack-sdk>=3.33.0",
    "ziptimezone>=1.1.8",
    "text-unidecode>=1.3",
    "render-sdk>=0.1.2",
    "opentelemetry-api>=1.36.0,<2",
    "opentelemetry-sdk>=1.36.0,<2",
    "opentelemetry-exporter-otlp>=1.36.0,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.36.0,<2",
    "opentelemetry-instrumentation-django>=0.57b0,<1",
    "opentelemetry-instrumentation-celery>=0.57b0,<1",
    "opentelemetry-instrumentation-requests>=0.57b0,<1",
    "opentelemetry-instrumentation-logging>=0.57b0,<1",
    "opentelemetry-semantic-conventions>=0.57b0,<1",
]

[tool.mypy]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
no_implicit_optional = true


[tool.django-stubs]
django_settings_module = "api.settings"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "SIM108", "SIM105", "B017", "F841", "E722", "B904"]
"*/tests/*" = ["ARG", "SIM108", "SIM105", "B017", "F841", "E722", "B904"]
"test_*" = ["ARG", "SIM108", "SIM105", "B017", "F841", "E722", "B904"]
"*test*" = ["ARG", "SIM108", "SIM105", "B017", "F841", "E722", "B904"]
"__init__.py" = ["F401"]
"settings.py" = ["F405"]
