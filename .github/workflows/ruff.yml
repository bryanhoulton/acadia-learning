name: Ruff

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ruff:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [api, agent]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version-file: "${{ matrix.project }}/.python-version"

      - name: Install FFmpeg 7 dev libraries (agent only, for av)
        if: matrix.project == 'agent'
        run: |
          sudo add-apt-repository -y ppa:ubuntuhandbook1/ffmpeg7
          sudo apt-get update
          sudo apt-get install -y ffmpeg libavformat-dev libavcodec-dev libavdevice-dev libavutil-dev libavfilter-dev libswscale-dev libswresample-dev pkg-config

      - name: Install dependencies
        run: uv sync
        working-directory: ${{ matrix.project }}

      - name: Run ruff linting
        run: uv run ruff check . --output-format=github
        working-directory: ${{ matrix.project }}

      - name: Run ruff formatting check
        run: uv run ruff format --check .
        working-directory: ${{ matrix.project }}
