      (function () {
        if (typeof window === "undefined") return;
        try {
          var params = new URLSearchParams(window.location.search);
          var fbpParam = params.get("fbp");
          var fbclidParam = params.get("fbclid");
          var hostParts = window.location.hostname.split(".");
          var rootDomain =
            hostParts.length > 1 ? hostParts.slice(-2).join(".") : hostParts[0];
          var cookieExpires = new Date(Date.now() + 15552000000).toUTCString();

          var setFbpCookie = function (value) {
            var cookie =
              "_fbp=" +
              value +
              ";path=/;expires=" +
              cookieExpires +
              ";SameSite=None;Secure";

            if (hostParts.length > 1) {
              cookie += ";domain=." + rootDomain;
            }

            document.cookie = cookie;
          };

          if (fbpParam) {
            setFbpCookie(fbpParam);
            sessionStorage.setItem("fbp", fbpParam);
          } else {
            var storedFbp = sessionStorage.getItem("fbp");
            if (storedFbp && document.cookie.indexOf("_fbp=") === -1) {
              setFbpCookie(storedFbp);
            }
          }

          if (fbclidParam) {
            sessionStorage.setItem("fbclid", fbclidParam);
          }
        } catch (error) {
          console.warn("Meta Pixel handoff failed", error);
        }
      })();
    </script>
